services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gridgo}
      POSTGRES_USER: ${POSTGRES_USER:-gridgo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gridgo_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55439}:5432"
    volumes:
      - gridgo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks:
      - default
      - gridgo-storage

  migrate:
    build: .
    command: ["npm", "run", "migrate"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gridgo}:${POSTGRES_PASSWORD:-gridgo_dev}@postgres:5432/${POSTGRES_DB:-gridgo}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - gridgo-storage

  seed:
    build: .
    command: ["npm", "run", "seed:dev"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gridgo}:${POSTGRES_PASSWORD:-gridgo_dev}@postgres:5432/${POSTGRES_DB:-gridgo}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY in .env}
      CLERK_ISSUER: ${CLERK_ISSUER:?set CLERK_ISSUER in .env}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:?set CLERK_AUTHORIZED_PARTIES in .env}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://127.0.0.1:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-gridgo_api_7f3a91c2}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-ggo_api_m1n10_9f41b7c3e68a2d55}
      MINIO_BUCKET: ${MINIO_BUCKET:-gridgo-uploads}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - default
      - gridgo-storage

  minio-bind-check:
    image: ghcr.io/gridgoph/mc:RELEASE.2025-07-21T05-28-08Z@sha256:e114957171327027e2440679742baff3dfb4acccf883471061b070926dad7342
    environment:
      MINIO_BIND_ADDRESS: ${MINIO_BIND_ADDRESS:-127.0.0.1}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        case "$${MINIO_BIND_ADDRESS}" in
          ""|"0.0.0.0"|*[!0-9.]* ) echo "MINIO_BIND_ADDRESS must be 127.0.0.1 or one exact trusted-LAN IPv4 address; wildcard publishing is forbidden" >&2; exit 1 ;;
        esac
        old_ifs="$${IFS}"; IFS=.; set -- $${MINIO_BIND_ADDRESS}; IFS="$${old_ifs}"
        [ "$${#}" -eq 4 ] || { echo "MINIO_BIND_ADDRESS must contain four IPv4 octets" >&2; exit 1; }
        for octet in "$${@}"; do [ "$${octet}" -ge 0 ] 2>/dev/null && [ "$${octet}" -le 255 ] || { echo "MINIO_BIND_ADDRESS has an invalid IPv4 octet" >&2; exit 1; }; done
        [ "$${1}" -eq 0 ] && [ "$${2}" -eq 0 ] && [ "$${3}" -eq 0 ] && [ "$${4}" -eq 0 ] && { echo "MINIO_BIND_ADDRESS cannot be the IPv4 wildcard" >&2; exit 1; }
        exit 0
    restart: "no"

  minio:
    image: ghcr.io/gridgoph/minio:RELEASE.2025-07-23T15-54-02Z@sha256:ec083fa6b02af8f3f971def273b3ab2f1a102ca0aa74e6b45c0bcb462f0f5cfe
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gridgo_root_4e39b7a1}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ggo_root_86c7e0a5d9124fb3}
    ports:
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - gridgo_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 3s
    restart: unless-stopped
    depends_on:
      minio-bind-check:
        condition: service_completed_successfully
    networks:
      - default
      - gridgo-storage

  minio-init:
    image: ghcr.io/gridgoph/mc:RELEASE.2025-07-21T05-28-08Z@sha256:e114957171327027e2440679742baff3dfb4acccf883471061b070926dad7342
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gridgo_root_4e39b7a1}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ggo_root_86c7e0a5d9124fb3}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-gridgo_api_7f3a91c2}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-ggo_api_m1n10_9f41b7c3e68a2d55}
    volumes:
      - ./docker/minio/gridgo-api-policy.json:/gridgo-api-policy.json:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/gridgo-uploads
        mc admin user info local "$${MINIO_ACCESS_KEY}" >/dev/null 2>&1 || mc admin user add local "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}"
        mc admin policy create local gridgo-api /gridgo-api-policy.json 2>/dev/null || true
        mc admin policy attach local gridgo-api --user "$${MINIO_ACCESS_KEY}"
    restart: "no"
    networks:
      - gridgo-storage

  api:
    build: .
    ports:
      - "127.0.0.1:${API_PORT:-18787}:8787"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-gridgo}:${POSTGRES_PASSWORD:-gridgo_dev}@postgres:5432/${POSTGRES_DB:-gridgo}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY in .env}
      CLERK_ISSUER: ${CLERK_ISSUER:?set CLERK_ISSUER in .env}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:?set CLERK_AUTHORIZED_PARTIES in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-gridgo_api_7f3a91c2}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-ggo_api_m1n10_9f41b7c3e68a2d55}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://127.0.0.1:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-gridgo-uploads}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
    depends_on:
      seed:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - default
      - gridgo-storage

volumes:
  gridgo_postgres_data:
  gridgo_minio_data:

networks:
  gridgo-storage:
    name: gridgo-api-storage-local
    internal: true
