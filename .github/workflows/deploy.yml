name: Build and deploy API

on:
  push:
    branches: [main, "fm/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  API_URL: https://gridgo-api.talasora.com
  DASHBOARD_ORIGIN: https://gridgo-dash.talasora.com
  REGISTRY: ghcr.io
  SMOKE_PORT: "38787"

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Checks against PostgreSQL 17
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gridgo_test
          POSTGRES_USER: gridgo
          POSTGRES_PASSWORD: ci-postgres-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gridgo -d gridgo_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://gridgo:ci-postgres-only@127.0.0.1:5432/gridgo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run migrate
      - run: npm run seed
      - run: npm test
      - run: npm audit --omit=dev

  image:
    name: Build image and prove PostgreSQL volume survival
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name and tags
        id: meta
        # Only default-branch builds publish to the registry, tagged with the
        # immutable sha-<12> plus `latest`. Every other ref builds and
        # smoke-tests the image locally and never pushes any tag.
        run: |
          set -euo pipefail
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          sha_tag="sha-${GITHUB_SHA::12}"
          tags="${image}:${sha_tag}"
          published=false
          if [ "${GITHUB_REF}" = "refs/heads/${DEFAULT_BRANCH}" ]; then
            tags="${tags},${image}:latest"
            published=true
          fi
          {
            echo "tags=${tags}"
            echo "primary=${image}:${sha_tag}"
            echo "published=${published}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GRIDGO_BUILD_SHA=${{ github.sha }}
            GRIDGO_BUILD_TIME=${{ steps.meta.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image and named database volume across replacements
        run: |
          set -euo pipefail
          IMAGE="${{ steps.meta.outputs.primary }}"
          DB_VOLUME="gridgo-smoke-postgres"
          MINIO_VOLUME="gridgo-smoke-minio"
          NETWORK="gridgo-smoke-net"
          DB_URL="postgresql://gridgo:smoke-db-secret@gridgo-postgres:5432/gridgo"
          MC="minio/mc:RELEASE.2025-07-21T05-28-08Z"
          docker volume create "$DB_VOLUME" >/dev/null
          docker volume create "$MINIO_VOLUME" >/dev/null
          docker network create "$NETWORK" >/dev/null

          start_postgres () {
            docker run -d --name gridgo-postgres --network "$NETWORK" \
              -e POSTGRES_DB=gridgo -e POSTGRES_USER=gridgo -e POSTGRES_PASSWORD=smoke-db-secret \
              -v "$DB_VOLUME":/var/lib/postgresql/data postgres:17-alpine >/dev/null
            for _ in $(seq 1 40); do
              docker exec gridgo-postgres pg_isready -U gridgo -d gridgo >/dev/null 2>&1 && return 0
              sleep 1
            done
            docker logs gridgo-postgres
            return 1
          }
          start_postgres

          docker run -d --name gridgo-minio --network "$NETWORK" \
            -e MINIO_ROOT_USER=smoke-root-user -e MINIO_ROOT_PASSWORD=smoke-root-secret \
            -e MINIO_BROWSER=off -v "$MINIO_VOLUME":/data \
            minio/minio:RELEASE.2025-07-23T15-54-02Z server /data --address :9000 >/dev/null
          for _ in $(seq 1 30); do
            docker run --rm --network "$NETWORK" --entrypoint /bin/sh "$MC" -ec \
              'mc alias set l http://gridgo-minio:9000 smoke-root-user smoke-root-secret' >/dev/null 2>&1 && break
            sleep 2
          done
          docker run --rm --network "$NETWORK" --entrypoint /bin/sh "$MC" -ec '
            mc alias set l http://gridgo-minio:9000 smoke-root-user smoke-root-secret
            mc mb --ignore-existing l/gridgo-uploads
            mc admin user add l smoke-bucket-user smoke-bucket-secret || true
            mc admin policy attach l readwrite --user smoke-bucket-user' >/dev/null

          docker run --rm --network "$NETWORK" -e DATABASE_URL="$DB_URL" "$IMAGE" npm run migrate
          docker run --rm --network "$NETWORK" -e DATABASE_URL="$DB_URL" "$IMAGE" npm run seed
          docker exec gridgo-postgres psql -U gridgo -d gridgo -v ON_ERROR_STOP=1 -c \
            "INSERT INTO catalog_products (id,name,family,base_price_minor,unit,position,data) VALUES ('prod_smoke_survivor','Redeploy Survivor','smoke',12345,'each',999,'{}')"

          printf '%s\n' \
            "DATABASE_URL=$DB_URL" \
            'CLERK_SECRET_KEY=test-only-placeholder' \
            'CLERK_ISSUER=https://smoke.clerk.accounts.dev' \
            'CLERK_AUTHORIZED_PARTIES=https://smoke.clerk.accounts.dev' \
            'MINIO_ACCESS_KEY=smoke-bucket-user' \
            'MINIO_SECRET_KEY=smoke-bucket-secret' \
            'MINIO_ENDPOINT=http://gridgo-minio:9000' \
            "CORS_ALLOWED_ORIGINS=${DASHBOARD_ORIGIN}" \
            "MINIO_PUBLIC_URL=${API_URL}" > /tmp/smoke.env

          start_api () {
            docker run -d --name "$1" --env-file /tmp/smoke.env --network "$NETWORK" \
              -p "127.0.0.1:${SMOKE_PORT}:8787" "$IMAGE" >/dev/null
          }
          wait_api () {
            for _ in $(seq 1 40); do
              curl -fsS "http://127.0.0.1:${SMOKE_PORT}/health" >/tmp/health.json 2>/dev/null && return 0
              sleep 1
            done
            docker logs "$1"
            return 1
          }
          prove_marker () {
            curl -fsS "http://127.0.0.1:${SMOKE_PORT}/catalog" >/tmp/catalog.json
            node -e 'const c=require("/tmp/catalog.json").catalog;if(!c.some(x=>x.id==="prod_smoke_survivor"))throw Error("database marker missing")'
          }

          start_api gridgo-smoke-api-1
          wait_api gridgo-smoke-api-1
          node -e 'const h=require("/tmp/health.json");if(!h.ok||h.database.status!=="available"||h.commit!==process.env.GITHUB_SHA)throw Error(JSON.stringify(h))'
          prove_marker

          docker rm -f gridgo-smoke-api-1 >/dev/null
          start_api gridgo-smoke-api-2
          wait_api gridgo-smoke-api-2
          prove_marker

          docker rm -f gridgo-smoke-api-2 gridgo-postgres >/dev/null
          start_postgres
          start_api gridgo-smoke-api-3
          wait_api gridgo-smoke-api-3
          prove_marker
          echo "PostgreSQL data survived API replacement and database-container recreation on the named volume."

      - name: Stop smoke containers
        if: always()
        run: |
          docker rm -f gridgo-smoke-api-1 gridgo-smoke-api-2 gridgo-smoke-api-3 gridgo-postgres gridgo-minio >/dev/null 2>&1 || true
          docker volume rm gridgo-smoke-postgres gridgo-smoke-minio >/dev/null 2>&1 || true
          docker network rm gridgo-smoke-net >/dev/null 2>&1 || true
          rm -f /tmp/smoke.env /tmp/health.json /tmp/catalog.json

      - name: Log in to registry
        if: steps.meta.outputs.published == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image
        if: steps.meta.outputs.published == 'true'
        run: |
          set -euo pipefail
          IFS=',' read -ra tags <<< "$TAGS"
          for tag in "${tags[@]}"; do docker push "$tag"; done
        env:
          TAGS: ${{ steps.meta.outputs.tags }}

  deploy:
    name: Deploy
    needs: image
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://gridgo-api.talasora.com
    steps:
      - name: Trigger restricted deploy command
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/known_hosts ~/.ssh/deploy_key
          printf '%s\n' "$GITHUB_TOKEN" | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=20 "$DEPLOY_USER@$DEPLOY_HOST" api
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm live commit and database health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            body="$(curl -fsS "${API_URL}/health?ci=${GITHUB_RUN_ID}-${attempt}" || true)"
            echo "$body"
            case "$body" in
              *"\"commit\":\"${GITHUB_SHA}\""*"\"database\":{\"status\":\"available\"}"*) exit 0 ;;
            esac
            sleep 6
          done
          echo "::error::live API never reported this commit with an available database"
          exit 1

      - name: Confirm browser origin boundary
        run: |
          set -euo pipefail
          echoed="$(curl -si -H "Origin: ${DASHBOARD_ORIGIN}" "${API_URL}/health" | tr -d '\r' | tr 'A-Z' 'a-z' | sed -n 's/^access-control-allow-origin: *//p' | head -1)"
          [ "$echoed" = "${DASHBOARD_ORIGIN}" ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://not-gridgo.example' "${API_URL}/health")" = "403" ]

      - name: Clean deploy credentials
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
