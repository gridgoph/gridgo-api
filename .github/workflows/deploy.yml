name: Build and deploy API

# Which event does what, and why:
#
#   pull_request  -> verify + build the image. Never publishes, never deploys.
#                    A proposal is not a decision: the registry the server pulls
#                    from must only ever contain reviewed code, and a fork PR
#                    gets a read-only token precisely so it cannot publish.
#                    Only fork PRs run here — for branches in this repository the
#                    `push` event below already covers the same commit, and two
#                    identical builds per commit is waste, not safety.
#
#   push: fm/**   -> verify + build + publish an immutable `sha-` tag. Does NOT
#                    move `latest` and does NOT deploy. This is how the pipeline
#                    is proven end-to-end before it is trusted with live data.
#
#   push: main    -> verify + build + publish, move `latest`, then deploy.
#                    Merging to the default branch is the decision to ship.
#
#   workflow_dispatch -> the same, honouring whichever ref it is run from, so an
#                    operator can re-publish or re-deploy without an empty commit.

on:
  push:
    branches:
      - main
      - "fm/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  API_URL: https://gridgo-api.talasora.com
  DASHBOARD_ORIGIN: https://gridgo-dash.talasora.com
  REGISTRY: ghcr.io
  # A high port for the smoke test. 3000/8081/8082/8083/8787/9000 belong to the
  # captain's demo and must never be bound by CI or by a local reproduction.
  SMOKE_PORT: "38787"

permissions:
  contents: read

concurrency:
  # One deploy at a time per ref. Superseding an in-flight run on the default
  # branch would abandon a half-finished deploy, so only branches cancel.
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Checks
    runs-on: ubuntu-latest
    # A pull request whose branch lives in this repository has already been run
    # by the `push` event on the very same commit, and its result is attached to
    # that commit. Running it twice buys nothing. A fork PR has no such run —
    # `push` never fires here for it — so that is the case this event exists for.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm test

  image:
    name: Build image
    # Skipped whenever `verify` is skipped, which is what keeps a same-repo pull
    # request from rebuilding a commit the push run already built.
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name and tags
        id: meta
        run: |
          set -euo pipefail
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          sha_tag="sha-${GITHUB_SHA::12}"
          branch_slug="$(printf '%s' "${GITHUB_REF_NAME}" | tr -c 'a-zA-Z0-9._-' '-')"

          tags="${image}:${sha_tag}"
          if [ "${GITHUB_REF}" = "refs/heads/${DEFAULT_BRANCH}" ]; then
            # `latest` is what the server pulls, so it moves only for the
            # default branch — never for a branch build.
            tags="${tags},${image}:latest"
          else
            tags="${tags},${image}:branch-${branch_slug}"
          fi

          published=false
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            published=true
          fi

          {
            echo "image=${image}"
            echo "tags=${tags}"
            echo "primary=${image}:${sha_tag}"
            echo "published=${published}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      - uses: docker/setup-buildx-action@v3

      # Build once, into the runner's own daemon, so the image that is smoke
      # tested is byte-for-byte the image that gets pushed.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GRIDGO_BUILD_SHA=${{ github.sha }}
            GRIDGO_BUILD_TIME=${{ steps.meta.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The single highest-risk property of this deployment: the whole domain
      # database is one JSON file, and if it lives in the container layer then
      # every deploy silently destroys every account, order and payment record.
      # So the smoke test does not just boot the image — it writes data, throws
      # the container away exactly as a deploy does, starts a *new* container on
      # the same volume, and proves the data is still there.
      - name: Smoke test — production image, then prove data survives a redeploy
        run: |
          set -euo pipefail
          IMAGE="${{ steps.meta.outputs.primary }}"
          VOLUME="gridgo-smoke-store"
          NETWORK="gridgo-smoke-net"
          MC="minio/mc:RELEASE.2025-07-21T05-28-08Z"
          docker volume create "$VOLUME" >/dev/null
          docker network create "$NETWORK" >/dev/null

          # A throwaway MinIO named exactly as the compose file names it, so the
          # image is smoke tested against the real MINIO_ENDPOINT value and a
          # real upload can be attempted. Uploads spool to a directory inside
          # the image before streaming to the bucket; without object storage
          # here, a container that cannot create that directory would pass every
          # other check and then fail on the first real artwork.
          docker run -d --name gridgo-minio --network "$NETWORK" \
            -e MINIO_ROOT_USER=smoke-root-user -e MINIO_ROOT_PASSWORD=smoke-root-secret \
            -e MINIO_BROWSER=off minio/minio:RELEASE.2025-07-23T15-54-02Z \
            server /data --address :9000 --console-address 127.0.0.1:9001 >/dev/null
          for _ in $(seq 1 30); do
            docker run --rm --network "$NETWORK" --entrypoint /bin/sh "$MC" -ec \
              'mc alias set l http://gridgo-minio:9000 smoke-root-user smoke-root-secret' >/dev/null 2>&1 && break
            sleep 2
          done
          docker run --rm --network "$NETWORK" --entrypoint /bin/sh "$MC" -ec '
            mc alias set l http://gridgo-minio:9000 smoke-root-user smoke-root-secret
            mc mb --ignore-existing l/gridgo-uploads
            mc admin user add l smoke-bucket-user smoke-bucket-secret
            mc admin policy attach l readwrite --user smoke-bucket-user' >/dev/null

          # The six account passwords the production image refuses to start
          # without. Throwaway values for a throwaway container.
          printf '%s\n' \
            'GRIDGO_CLIENT_PASSWORD=smoke-client-secret-1' \
            'GRIDGO_INDIVIDUAL_PASSWORD=smoke-individual-secret-2' \
            'GRIDGO_SUPPLIER_PASSWORD=smoke-supplier-secret-3' \
            'GRIDGO_RIDER_PASSWORD=smoke-rider-secret-4' \
            'GRIDGO_OPS_PASSWORD=smoke-ops-secret-5' \
            'GRIDGO_ADMIN_PASSWORD=smoke-admin-secret-6' \
            'MINIO_ACCESS_KEY=smoke-bucket-user' \
            'MINIO_SECRET_KEY=smoke-bucket-secret' \
            'MINIO_ENDPOINT=http://gridgo-minio:9000' \
            "CORS_ALLOWED_ORIGINS=${DASHBOARD_ORIGIN}" \
            "MINIO_PUBLIC_URL=${API_URL}" \
            > /tmp/smoke.env

          # ---- seed the store on the volume, exactly as store-init does ----
          # MinIO is absent throughout this step: file routes 503, everything
          # else works, which is the intended degradation.
          docker run --rm --env-file /tmp/smoke.env \
            -v "$VOLUME":/var/lib/gridgo-api "$IMAGE" node src/seed.js

          # ---- production refuses to start without configured credentials ----
          # A designed refusal, so a container that *does* start here is the
          # failure. The store already exists, so the only reason to refuse is
          # the missing password — and the check insists the refusal names it.
          # `timeout` bounds a server that wrongly starts and would otherwise
          # run forever; a non-zero exit alone cannot tell the two apart, so the
          # log is what decides.
          timeout 30 docker run --rm --env-file /tmp/smoke.env \
            --env GRIDGO_ADMIN_PASSWORD= \
            -v "$VOLUME":/var/lib/gridgo-api "$IMAGE" \
            > /tmp/nocreds.log 2>&1 || true
          if grep -q 'listening on' /tmp/nocreds.log; then
            echo "::error::the production image started with GRIDGO_ADMIN_PASSWORD unset"
            cat /tmp/nocreds.log; exit 1
          fi
          if ! grep -q 'GRIDGO_ADMIN_PASSWORD is required' /tmp/nocreds.log; then
            echo "::error::refusal did not name the missing variable"
            cat /tmp/nocreds.log; exit 1
          fi
          echo "refuses to start without credentials: ok"

          start_api () {
            docker run -d --name "$1" --env-file /tmp/smoke.env \
              --network "$NETWORK" \
              -p "127.0.0.1:${SMOKE_PORT}:8787" \
              -v "$VOLUME":/var/lib/gridgo-api "$IMAGE"
          }
          wait_health () {
            for _ in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${SMOKE_PORT}/health" >/tmp/health.json 2>/dev/null; then
                return 0
              fi
              sleep 2
            done
            echo "::error::/health never answered"; docker logs "$1"; return 1
          }

          start_api gridgo-smoke-1 >/dev/null
          wait_health gridgo-smoke-1

          echo "--- /health ---"; cat /tmp/health.json; echo
          node -e '
            const h = require("/tmp/health.json");
            if (h.ok !== true) throw new Error("health did not report ok");
            if (h.service !== "gridgo-api") throw new Error("health reports service " + h.service);
            if (h.commit !== process.env.GITHUB_SHA) throw new Error("health reports commit " + h.commit);
            if (h.storage.status !== "available") throw new Error("storage is " + h.storage.status);
            console.log("health ok:", h.commit, "storage:", h.storage.status);
          '

          # ---- the browser boundary ----
          # Strip CR, fold header names to lower case, print the value only.
          # Comparing the value *exactly* is what rules out `*` as well as a
          # near-miss origin — a substring match would accept both.
          allow_origin_header () {
            tr -d '\r' | tr 'A-Z' 'a-z' | sed -n 's/^access-control-allow-origin: *//p' | head -1
          }
          echoed="$(curl -si -H "Origin: ${DASHBOARD_ORIGIN}" "http://127.0.0.1:${SMOKE_PORT}/health" | allow_origin_header)"
          [ "$echoed" = "${DASHBOARD_ORIGIN}" ] \
            || { echo "::error::allow-origin was '${echoed}', expected '${DASHBOARD_ORIGIN}'"; exit 1; }
          echo "dashboard origin accepted: ok"

          refused="$(curl -s -o /tmp/refused.json -w '%{http_code}' \
            -H 'Origin: https://not-gridgo.example' "http://127.0.0.1:${SMOKE_PORT}/health")"
          [ "$refused" = "403" ] || { echo "::error::foreign origin got $refused, expected 403"; exit 1; }
          grep -q 'origin_not_allowed' /tmp/refused.json \
            || { echo "::error::403 body was not origin_not_allowed"; cat /tmp/refused.json; exit 1; }
          echo "foreign origin refused: ok"

          # ---- write data, then redeploy over it ----
          marker="smoke-$(date -u +%s)@gridgo.test"
          curl -fsS "http://127.0.0.1:${SMOKE_PORT}/auth/signup" \
            -H 'Content-Type: application/json' \
            --data "$(node -e 'console.log(JSON.stringify({
              role: "client", name: "Redeploy Survivor", email: process.argv[1],
              phone: "+63 900 000 0000", password: "smoke-survivor-secret",
              accountType: "individual"
            }))' "$marker")" > /tmp/signup.json
          node -e '
            const s = require("/tmp/signup.json");
            if (!s.user || !s.user.id) throw new Error("signup did not return a user: " + JSON.stringify(s));
            console.log("wrote user", s.user.id);
          '

          # A real streamed upload, all the way to the bucket, then a signed
          # read-back URL. This is the check that catches an image whose upload
          # spool directory is not writable — a fault every other check here
          # reports as perfectly healthy.
          TOKEN="$(node -e 'console.log(require("/tmp/signup.json").token)')"
          printf '\x89PNG\r\n\x1a\n' > /tmp/artwork.png
          node -e 'require("fs").appendFileSync("/tmp/artwork.png", Buffer.alloc(256, 7))'
          curl -fsS -X POST "http://127.0.0.1:${SMOKE_PORT}/files" \
            -H "Authorization: Bearer $TOKEN" \
            -F 'purpose=artwork' -F 'file=@/tmp/artwork.png;type=image/png' > /tmp/upload.json
          FILE_ID="$(node -e '
            const f = require("/tmp/upload.json").file;
            if (f.state !== "ready") throw new Error("uploaded file state is " + f.state);
            console.log(f.fileId);
          ')"
          curl -fsS "http://127.0.0.1:${SMOKE_PORT}/files/$FILE_ID/download-url" \
            -H "Authorization: Bearer $TOKEN" > /tmp/downloadurl.json
          node -e '
            const d = require("/tmp/downloadurl.json");
            const u = new URL(d.downloadUrl || d.url);
            if (u.origin !== process.env.API_URL) throw new Error("signed origin " + u.origin);
            if (!u.pathname.startsWith("/gridgo-uploads/")) throw new Error("signed path " + u.pathname);
            if (!u.searchParams.get("X-Amz-Signature")) throw new Error("download URL is not signed");
            console.log("uploaded and signed a read-back URL on", u.origin);
          '

          # A deploy is exactly this: destroy the container, start a new one from
          # the image, same volume. Nothing is copied across by hand.
          docker rm -f gridgo-smoke-1 >/dev/null
          start_api gridgo-smoke-2 >/dev/null
          wait_health gridgo-smoke-2

          login="$(curl -s -o /tmp/login.json -w '%{http_code}' \
            "http://127.0.0.1:${SMOKE_PORT}/auth/login" -H 'Content-Type: application/json' \
            --data "$(node -e 'console.log(JSON.stringify({
              email: process.argv[1], password: "smoke-survivor-secret"
            }))' "$marker")")"
          [ "$login" = "200" ] || {
            echo "::error::the account created before the redeploy is gone (login $login). The store is not on a durable volume."
            cat /tmp/login.json; exit 1;
          }
          RETOKEN="$(node -e 'console.log(require("/tmp/login.json").token)')"
          curl -fsS "http://127.0.0.1:${SMOKE_PORT}/files/$FILE_ID" \
            -H "Authorization: Bearer $RETOKEN" > /tmp/refile.json
          node -e '
            const f = require("/tmp/refile.json").file;
            if (f.state !== "ready") throw new Error("file state after redeploy is " + f.state);
            console.log("uploaded file still ready after the redeploy:", f.fileId);
          '
          echo "data survived a container replacement: ok"

          # ---- the container's own opinion of itself, and its user ----
          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' gridgo-smoke-2)"
            [ "$status" = "starting" ] || break
            sleep 2
          done
          echo "docker health: $status"
          [ "$status" = "healthy" ] || { docker logs gridgo-smoke-2; exit 1; }

          user="$(docker exec gridgo-smoke-2 id -un)"
          echo "runs as: $user"
          [ "$user" != "root" ] || { echo "::error::container runs as root"; exit 1; }

      - name: Stop smoke containers
        if: always()
        run: |
          docker rm -f gridgo-smoke-1 gridgo-smoke-2 gridgo-minio >/dev/null 2>&1 || true
          docker volume rm gridgo-smoke-store >/dev/null 2>&1 || true
          docker network rm gridgo-smoke-net >/dev/null 2>&1 || true

      - name: Log in to the registry
        if: steps.meta.outputs.published == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image
        if: steps.meta.outputs.published == 'true'
        run: |
          set -euo pipefail
          IFS=',' read -ra tags <<< "$TAGS"
          for tag in "${tags[@]}"; do
            echo "pushing $tag"
            docker push "$tag"
          done
        env:
          TAGS: ${{ steps.meta.outputs.tags }}

  deploy:
    name: Deploy
    needs: image
    # Only the default branch ships. A pull request — and a branch build — stops
    # at a published tag that nothing on the server points at.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://gridgo-api.talasora.com
    steps:
      - name: Trigger the restricted deploy command
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/known_hosts ~/.ssh/deploy_key

          # The key is pinned to ~/gridgo/bin/deploy.sh in authorized_keys, so
          # `api` is the entire command surface — there is no shell on that
          # server for CI to reach. The token on stdin is this run's own
          # GITHUB_TOKEN: the server needs a credential to pull from the private
          # registry, and this one expires when the run ends, so nothing durable
          # is left on the box.
          #
          # Host key checking stays on. Accepting an unknown key would let anyone
          # who can intercept the connection collect the deploy key.
          printf '%s\n' "$GITHUB_TOKEN" | ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" api
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm the live API is running this commit
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            body="$(curl -fsS "${API_URL}/health?ci=${GITHUB_RUN_ID}-${attempt}" || true)"
            echo "$body"
            case "$body" in
              *"\"commit\":\"${GITHUB_SHA}\""*)
                echo "Deployed commit confirmed live at ${API_URL}."
                exit 0
                ;;
            esac
            sleep 6
          done
          echo "::error::${API_URL} never reported commit ${GITHUB_SHA}. The deploy did not take."
          exit 1

      - name: Confirm the dashboard origin is accepted and a foreign one is not
        run: |
          set -euo pipefail
          echoed="$(curl -si -H "Origin: ${DASHBOARD_ORIGIN}" "${API_URL}/health" \
            | tr -d '\r' | tr 'A-Z' 'a-z' | sed -n 's/^access-control-allow-origin: *//p' | head -1)"
          [ "$echoed" = "${DASHBOARD_ORIGIN}" ] \
            || { echo "::error::live API answered allow-origin '${echoed}', expected '${DASHBOARD_ORIGIN}'"; exit 1; }

          refused="$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Origin: https://not-gridgo.example' "${API_URL}/health")"
          [ "$refused" = "403" ] \
            || { echo "::error::live API answered a foreign origin with ${refused}, expected 403"; exit 1; }
          echo "live browser boundary: ok"

      - name: Clean up deploy credentials
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
